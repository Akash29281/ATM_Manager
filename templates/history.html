<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
</head>
<body>

    <h1>Transaction History</h1>

    <table border="1">

        <tr>
            <th>Type</th>
            <th>Amount</th>
        </tr>

        {% for transaction in transactions %}
        <tr>
            <td>{{ transaction[0] }}</td>
            <td>₹{{ transaction[1] }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
